name: Build and Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag_name:
        description: 'Tag name to release (e.g. v0.2.0)'
        required: false
        default: 'v0.2.0'

permissions:
  contents: write

jobs:
  release:
    name: Build & Publish Release
    runs-on: windows-latest

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Compile Lucent Display Control
        shell: cmd
        run: |
          call build.bat
          if not exist LucentControl.exe (
            echo LucentControl.exe was not created!
            exit /b 1
          )

      - name: Run Automated Test Suite
        shell: cmd
        run: |
          C:\Windows\Microsoft.NET\Framework64\v4.0.30319\csc.exe /target:exe /out:RunTests.exe /r:LucentControl.exe /r:System.Xaml.dll /r:C:\Windows\Microsoft.NET\Framework64\v4.0.30319\WPF\PresentationCore.dll /r:C:\Windows\Microsoft.NET\Framework64\v4.0.30319\WPF\PresentationFramework.dll /r:C:\Windows\Microsoft.NET\Framework64\v4.0.30319\WPF\WindowsBase.dll /r:System.Drawing.dll /r:System.Windows.Forms.dll tools\RunTests.cs
          RunTests.exe
          del RunTests.exe

      - name: Package Release Assets
        shell: pwsh
        run: |
          $tag = if ($env:GITHUB_REF -like "refs/tags/*") { $env:GITHUB_REF.Substring(10) } else { "${{ github.event.inputs.tag_name }}" }
          if (-not $tag) { $tag = "v0.2.0" }
          $zipName = "LucentControl-$tag-win-x64.zip"
          Compress-Archive -Path "LucentControl.exe", "README.md", "LICENSE" -DestinationPath $zipName
          Write-Host "Created release package: $zipName"
          echo "TAG_NAME=$tag" >> $env:GITHUB_ENV
          echo "ZIP_NAME=$zipName" >> $env:GITHUB_ENV

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          name: Lucent Display Control ${{ env.TAG_NAME }}
          tag_name: ${{ env.TAG_NAME }}
          draft: false
          prerelease: false
          generate_release_notes: true
          files: |
            LucentControl.exe
            ${{ env.ZIP_NAME }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
